[package]
name = "gwid"
version = "0.0.2"
edition = "2024"
description = "RFC 9562-compliant UUIDs"
authors = ["Matthew Oestreich"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/matthewoestreich/gwid"
homepage = "https://github.com/matthewoestreich/gwid#README.md"
documentation = "https://docs.rs/gwid"
readme = "README.md"
keywords = ["uuid", "uuidv7", "uuidv4", "guid", "identifier"]
# See available categories here: https://crates.io/category_slugs
categories = ["algorithms", "cryptography"]

[dependencies]
rand = "0.10.3"

[features]
v7-crypto-rand = []
v7-global-monotonicity = []
default = []

[[bench]]
name = "v7"
harness = false
# required-features = ['v7-crypto-rand']
