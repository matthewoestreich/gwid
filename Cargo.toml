[package]
name = "gwid"
version = "0.0.6"
edition = "2024"
description = "RFC 9562-compliant UUIDs"
authors = ["Matthew Oestreich"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/matthewoestreich/gwid"
homepage = "https://github.com/matthewoestreich/gwid#README.md"
documentation = "https://docs.rs/gwid"
readme = "README.md"
keywords = ["uuid", "uuidv7", "uuidv4", "guid", "identifier"]
# See available categories here: https://crates.io/category_slugs
categories = ["algorithms", "cryptography"]

[dependencies]
rand = "0.10.3"

[dev-dependencies.uuid]
version = "1.29.2"
# Lets you generate random UUIDs
features = ["v4", "v7"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.gungraun]
version = "0.20"

[[bench]]
name = "gungraun_v7"
harness = false

[[bench]]
name = "v7"
harness = false
# required-features = ['v7-crypto-rand']

[profile.bench-debug]
inherits = "bench"
debug = true
strip = false

[features]
v7-crypto-rand = []
v7-global-monotonicity = []
default = []
