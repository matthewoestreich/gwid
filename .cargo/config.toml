[alias]
t-all = "nextest run --all-features"
t-global = "nextest run --features v7-global-monotonicity"
t = "nextest run"
b-all = "bench --all-features"
b-v7-no-features = "bench --bench v7"
b-v7-all = "bench --bench v7 --all-features"
b-v7-global-mono = "bench --bench v7 --features v7-global-monotonicity"
